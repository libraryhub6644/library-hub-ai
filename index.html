<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library Hub — Private Study Library Websites &amp; Portal</title>
    <meta
      name="description"
      content="Library Hub builds dedicated, private websites for modern study libraries with custom domains, student seat passes, fee tracking, and WhatsApp reminders."
    />
    <meta
      name="keywords"
      content="Library Hub, study library software, reading room website, library seat management, student fee tracker, private library portal"
    />
    <meta name="theme-color" content="#008B5E" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://libraryhub.dpdns.org/" />
    <script>
      (function () {
        try {
          var mode = window.localStorage.getItem('lh_appearance_mode');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(mode === 'dark' ? 'dark' : 'light');

          var p = window.location.pathname.replace(/\/+$/, '') || '/';
          var hex = '';
          if (p === '/' || p === '/superadmin') {
            hex = window.localStorage.getItem('lh_platform_theme') || '';
          } else {
            var seg = p.slice(1).split('/')[0] || '';
            if (seg) hex = window.localStorage.getItem('lh_library_theme_' + seg.toLowerCase()) || '';
          }
          if (!/^#[0-9a-fA-F]{6}$/.test(hex) || hex.toUpperCase() === '#D4A359') {
            hex = '#008B5E';
          }
          var h = hex.slice(1);
          var r = parseInt(h.slice(0, 2), 16);
          var g = parseInt(h.slice(2, 4), 16);
          var b = parseInt(h.slice(4, 6), 16);
          root.style.setProperty('--accent', hex.toUpperCase());
          root.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
          var lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
          root.style.setProperty('--accent-contrast', lum > 0.62 ? '#083E2B' : '#FFFFFF');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', hex.toUpperCase());
        } catch (e) {}
      })();
    </script>
